    <title>Chunsheng Zhang | Software Engineer</title>
    <script>
      // SPA routing fallback for GitHub Pages
      var path = window.location.pathname;
      var base = '/';
      if (path !== base) {
        window.location.replace(base + path);
      } else {
        window.location.replace(base);
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
